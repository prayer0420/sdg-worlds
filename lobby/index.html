<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>네온 로비</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060f; color: #f2ecff; font: 14px/1.4 system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .chip { pointer-events: auto; position: absolute; padding: 8px 13px; border-radius: 999px; background: rgba(12, 8, 26, .62); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, .12); color: inherit; text-decoration: none; font-weight: 650; }
  #back { top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); }
  #time { top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); font-weight: 500; opacity: .85; font-variant-numeric: tabular-nums; }
  #hint { left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); white-space: nowrap; font-weight: 500; }
  #xr { position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: auto; }
  #xr button { border: 0; border-radius: 999px; padding: 11px 18px; font: 700 15px/1 inherit; font-family: inherit; color: #07060f; cursor: pointer; }
  #vrBtn { background: #2ee6ff; box-shadow: 0 0 18px rgba(46, 230, 255, .55); }
  #arBtn { background: #ffd23f; box-shadow: 0 0 18px rgba(255, 210, 63, .5); }
  #xrNote { max-width: 260px; text-align: right; font-size: 12px; opacity: .7; }
  #pre { left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); font-weight: 500; font-size: 12px; opacity: 0; transition: opacity .3s; }
  #pre.on { opacity: .9; }
  #tip { position: absolute; transform: translate(-50%, -140%); padding: 6px 10px; border-radius: 8px; background: rgba(12, 8, 26, .8); font-weight: 650; opacity: 0; transition: opacity .15s; white-space: nowrap; }
  #tip.on { opacity: 1; }
  #flash { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity .55s ease-in; }
  #flash.on { opacity: 1; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #pass { top: calc(54px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); font-weight: 650; border-color: rgba(255, 210, 63, .45); color: #ffe680; }
  #card { position: fixed; z-index: 5; right: calc(14px + env(safe-area-inset-right, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); width: min(380px, calc(100vw - 28px)); max-height: calc(100vh - 28px); overflow: auto;
    padding: 18px; border-radius: 18px; background: rgba(14, 10, 26, .9); backdrop-filter: blur(10px); border: 1px solid color-mix(in srgb, var(--g) 60%, transparent); box-shadow: 0 0 40px -10px var(--g); }
  #card .x { position: absolute; right: 10px; top: 10px; border: 0; background: transparent; color: inherit; font-size: 18px; cursor: pointer; }
  #card .badge { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font: 800 24px/1 system-ui, sans-serif; background: var(--g); color: #fff; }
  #card h2 { margin: 10px 0 4px; font-size: 21px; }
  #card .kid { margin: 0 0 8px; font-size: 15px; font-weight: 650; }
  #card ul { margin: 0 0 10px; padding-left: 18px; color: #c9c0e6; font-size: 13px; display: grid; gap: 3px; }
  #card .q { padding: 12px; border-radius: 12px; background: rgba(255, 255, 255, .06); }
  #card .qt { font-size: 12px; font-weight: 800; color: #ffe680; letter-spacing: .04em; }
  #card .q p { margin: 6px 0 10px; font-weight: 650; }
  #card .ox { display: flex; gap: 8px; }
  #card .ox button { flex: 1; padding: 10px; border-radius: 10px; border: 0; font: 800 20px/1 system-ui, sans-serif; cursor: pointer; }
  #card .ox button[data-a="1"] { background: #3dffa8; color: #062016; }
  #card .ox button[data-a="0"] { background: #ff5f7a; color: #2a0610; }
  #card .fb { margin-top: 8px; font-size: 13.5px; min-height: 1.3em; }
  #card .fb.ok { color: #9fffd0; } #card .fb.no { color: #ffb0bd; }
  #card .src { margin: 10px 0 0; font-size: 11.5px; color: #9a90b8; }
  #card .src a { color: inherit; }
  @media (max-width: 520px) { #card { top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); max-height: 62vh; } }
  @media (max-width: 520px) { #hint { font-size: 12px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="hud">
  <a id="back" class="chip" href="/sdg-worlds/">← 포털</a>
  <a id="pass" class="chip" href="/sdg-worlds/passport/">SDG 여권</a>
  <div id="time" class="chip">불러오는 중…</div>
  <div id="pre" class="chip"></div>
  <div id="xr"><button id="vrBtn" hidden>VR로 입장</button><button id="arBtn" hidden>AR로 입장</button><div id="xrNote"></div></div>
  <div id="hint" class="chip">드래그로 둘러보기 · SDG 기둥을 눌러 퀴즈 · 문을 눌러 입장</div>
  <div id="tip"></div>
</div>
<div id="card" hidden></div>
<div id="flash"></div>
<script src="/sdg-worlds/sdg/sdg.js"></script>
<div id="err">이 브라우저에서는 3D(WebGL)를 켤 수 없어요.</div>
<script type="module" src="lobby.js"></script>
</body>
</html>
